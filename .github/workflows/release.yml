name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check-version:
    name: tag matches package versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          root=$(node -p "require('./package.json').version")
          rust=$(sed -n 's/^version = "\([^"]*\)"/\1/p' rust/Cargo.toml | head -1)
          if [ "$tag" != "$root" ] || [ "$tag" != "$rust" ]; then
            echo "Tag v$tag, package.json $root, rust/Cargo.toml $rust must match" >&2
            exit 1
          fi
          for manifest in npm/*/package.json legacy/markit-ai/package.json; do
            published=$(node -p "require('./$manifest').version")
            if [ "$published" != "$tag" ]; then
              echo "$manifest version $published does not match tag v$tag" >&2
              exit 1
            fi
          done

  verify:
    name: verify source
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> rust/target
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: npm run build
      - run: npm run check:rust
      - run: cd rust && cargo test

  build:
    name: build ${{ matrix.target }}
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            musl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            musl: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> rust/target
          key: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        if: matrix.musl
        with:
          version: 0.13.0
      - run: bun install --frozen-lockfile
      - name: Build native addon
        run: >-
          bunx napi build --release --strip --platform
          --target ${{ matrix.target }}
          --features napi --cargo-flags=--no-default-features
          --cargo-cwd rust
          ${{ matrix.musl && '--zig' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: "*.node"
          if-no-files-found: error

  publish:
    name: publish npm packages
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Move binaries into platform packages
        run: bunx napi artifacts -d artifacts
      - name: Determine npm tag
        id: npm-tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" == *-* ]]; then
            prerelease="${version#*-}"
            echo "tag=${prerelease%%.*}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish platform packages and @shift-labs/markit
        run: npm publish --tag ${{ steps.npm-tag.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish and deprecate markit-ai compatibility shim
        run: |
          npm publish ./legacy/markit-ai --tag ${{ steps.npm-tag.outputs.tag }} --access public
          npm deprecate "markit-ai@*" "Moved to @shift-labs/markit. Install @shift-labs/markit instead."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
