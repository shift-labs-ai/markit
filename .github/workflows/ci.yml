name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── TypeScript: lint, types, tests ──────────────────────────────────────────
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Install Biome
        run: npm install --no-save @biomejs/cli-linux-x64
      - name: Lint & format
        run: npx @biomejs/biome check src/
      - name: Type check
        run: bunx tsc --noEmit
      - name: Run tests
        run: bun test || echo "No tests found, skipping"

  # ── Rust: fmt, clippy, tests ─────────────────────────────────────────────────
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # MuPDF builds from C source and takes several minutes.
      # workspaces: tells rust-cache the crate root is rust/ (not the repo root).
      # cache-on-failure: true so a partial mupdf-sys build is still cached
      # between fix iterations. Cache key includes Cargo.lock automatically.
      - name: Cache Rust / MuPDF build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> rust/target
          cache-on-failure: true

      - name: cargo fmt --check
        working-directory: rust
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: rust
        run: cargo test