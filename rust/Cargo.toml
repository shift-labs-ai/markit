[package]
name = "markit"
version = "0.5.3"
edition = "2021"
description = "Convert anything to markdown."
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ego-tree = "0.11"
kamadak-exif = "0.6.1"
lofty = "0.25.0"
mupdf = "0.8.0"
napi = { version = "2", default-features = false, features = ["napi8", "async"], optional = true }
napi-derive = { version = "2", optional = true }
regex = "1.13.1"
roxmltree = "0.21.1"
# "deterministic" keeps attributes in source order (IndexMap) — required for
# byte-parity with domino's outerHTML when tables are kept as raw HTML.
scraper = { version = "0.27.0", features = ["deterministic"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = "3.4.0"
zip = "8.6.0"

[features]
default = ["cli"]
# The clap CLI binary. Deselected by npm's build:native (napi symbols only
# resolve inside a Node process, so the bin cannot link with "napi" active).
cli = []
napi = ["dep:napi", "dep:napi-derive", "dep:napi-build"]

[lints.clippy]
# The PDF pipeline and HTML→MD engine are line-for-line ports of the TS
# originals (and of JSC's StableSort.h). Index-based loops intentionally
# mirror the source structure to keep the ports auditable.
needless_range_loop = "allow"
# CTM mirrors the TS type name (PDF current transformation matrix).
upper_case_acronyms = "allow"

[build-dependencies]
napi-build = { version = "2", optional = true }

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "markit"
path = "src/main.rs"
required-features = ["cli"]
